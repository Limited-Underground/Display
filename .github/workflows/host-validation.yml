name: Host validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Windows host matrix
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Run complete host matrix
        shell: pwsh
        env:
          OPENGAUGE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: .\tools\Test-Host.ps1
